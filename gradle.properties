org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP registers its generated sources through kotlin.sourceSets, which AGP 9's
# built-in Kotlin rejects by default. Transitional until KSP adopts the
# android.sourceSets DSL. See developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

kotlin.code.style=official
